<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="/reset.css">
    <meta name="viewport" content="minimum-scale=1, initial-scale=1, width=device-width, shrink-to-fit=no" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Webatrice: A Cockatrice Web Client"
    />
    <link rel="apple-touch-icon" href="logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Webatrice</title>
    <link rel="preload" href="../../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Runtime environment config (per-deploy). Loaded synchronously so
         window.Cockatrice.env is set before the app module runs. The GA
         measurement id lives here; src/services/analytics.ts reads it and
         bootstraps Google Analytics only when a key is present. -->
    <script src="/env.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Capability preflight, a classic ES5 script so it also runs where the
         bundle cannot parse. It renders the unsupported screen itself, and the
         module entry below loads the app only when it passed. -->
    <script src="/preflight.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
